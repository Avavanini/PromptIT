<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt IT</title>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; background-color: #0B0D17; color: #FFFFFF; font-family: system-ui, -apple-system, sans-serif;">
        <img src="/logo.svg" alt="Prompt IT" style="width: 48px; height: 48px; margin-bottom: 16px; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;" />
        <span style="font-size: 24px; font-weight: bold; letter-spacing: -0.025em;">Prompt IT</span>
      </div>
      <style>
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: .5; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
